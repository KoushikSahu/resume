name: Build Check

on:
  push:
    branches:
      - "**"
    tags:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/texlive/packages.txt

      - name: Install Twemoji Mozilla font
        run: |
          mkdir -p ~/.local/share/fonts
          curl -fsSL --retry 3 \
            https://github.com/mozilla/twemoji-colr/releases/download/v0.7.0/Twemoji.Mozilla.ttf \
            -o ~/.local/share/fonts/TwemojiMozilla.ttf
          fc-cache -f

      - name: Build resume
        run: make compile

      - name: Check for LaTeX errors
        run: |
          if grep -q "^!\\|^./resume/Koushik_Sahu_Resume.tex:[0-9]*:" \
              resume/Koushik_Sahu_Resume.log; then
            echo "::error::LaTeX compilation reported errors"
            grep -A5 "^!" resume/Koushik_Sahu_Resume.log
            exit 1
          fi